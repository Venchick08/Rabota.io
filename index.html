<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Смена</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#1a1240;--bg2:#2a1b63;--card:#2f2170;--gold:#ffc83d;--plus:#3ee6a8;--minus:#ff5a6e;--ink:#fff4e0;--mute:#a99ee0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -10%,var(--bg2),var(--bg) 60%) fixed;color:var(--ink);font-family:"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif}
body{padding:calc(12px + env(safe-area-inset-top,0px)) 14px calc(24px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto}
.week{display:flex;gap:6px;margin-bottom:14px}
.day{flex:1;text-align:center;font-size:13px;color:var(--mute)}
.day i{display:block;height:12px;border-radius:7px;background:#00000040;margin-bottom:5px;transition:background .4s,box-shadow .4s}
.day.we i{background:#ff8ad826}
.day.on{color:var(--gold)}
.day.on i{background:var(--gold);box-shadow:0 0 14px #ffc83dcc,0 0 3px #fff1a8}
.day.we.on{color:#ff8ad8}
.day.we.on i{background:#ff8ad8;box-shadow:0 0 14px #ff8ad8cc,0 0 3px #ffd0f2}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1;padding:11px;border:0;border-radius:14px;background:#00000033;color:var(--mute);font:inherit;font-size:16px}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 2px var(--gold)}
.card{background:var(--card);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:0 5px 0 #00000040}
label{display:block;font-size:14px;color:var(--mute);margin-bottom:5px}
.row{display:flex;gap:8px;align-items:center}
input{width:100%;padding:13px 14px;border-radius:14px;border:2px solid #ffffff1a;background:#150e36;color:var(--ink);font:inherit;font-size:22px;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:var(--gold);box-shadow:0 0 0 4px #ffc83d33}
input[type=date],input[type=month]{font-size:17px;display:block;min-width:0;max-width:100%;min-height:54px;line-height:1.2;text-align:left;-webkit-appearance:none;appearance:none}
input::-webkit-date-and-time-value{text-align:left;min-height:1.2em;margin:0}
input::-webkit-calendar-picker-indicator{opacity:.8;filter:invert(.85)}
.card,.field,.g2>div,.row{min-width:0}
.row input{min-width:0}
html,body{overflow-x:hidden}
.pm{flex:none;width:52px;height:52px;border:0;border-radius:14px;background:#150e36;color:var(--gold);font:inherit;font-size:24px}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.field{margin-bottom:12px}.field:last-child{margin-bottom:0}
.hero{text-align:center;padding:18px 12px}
.hero small{color:var(--mute);font-size:15px}
.big{overflow-wrap:anywhere;font-size:46px;line-height:1.1;margin:6px 0 2px;text-shadow:0 4px 0 #00000055;transition:color .3s}
.big.p{color:var(--plus);text-shadow:0 0 22px #3ee6a888,0 4px 0 #00000055}
.big.m{color:var(--minus);text-shadow:0 0 22px #ff5a6e88,0 4px 0 #00000055}
.tag{display:inline-block;margin-top:4px;padding:5px 12px;border-radius:20px;font-size:14px;background:#00000040}
.sum{display:flex;justify-content:space-between;font-size:15px;color:var(--mute);margin-top:12px;padding-top:10px;border-top:2px dashed #ffffff22}
.sum b{color:var(--ink)}
.go{width:100%;padding:17px;border:0;border-radius:18px;background:var(--gold);color:#3a2600;font:inherit;font-size:20px;box-shadow:0 6px 0 #b88400;transition:transform .08s,box-shadow .08s}
.go:active{transform:translateY(5px);box-shadow:0 1px 0 #b88400}
.shake{animation:sh .5s}
@keyframes sh{20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.pop{animation:pp .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pp{0%{transform:scale(.8)}100%{transform:scale(1)}}
.item{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:2px dashed #ffffff18}
.item:last-child{border:0}
.item .d{flex:1;min-width:0;overflow-wrap:anywhere}.item .v{flex:none}.item .d b{display:block;font-size:16px}.item .d span{font-size:13px;color:var(--mute)}
.item .v{font-size:18px}.v.p{color:var(--plus)}.v.m{color:var(--minus)}
.del{flex:none;border:0;background:#00000040;color:var(--minus);font-size:16px;width:38px;height:38px;border-radius:11px;padding:0}
.empty{text-align:center;color:var(--mute);padding:22px 8px;font-size:16px}
.me{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.av{flex:none;width:46px;height:46px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--gold);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:19px;color:var(--gold)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.nm{min-width:0}
.nm b,.nm span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm b{font-size:17px}.nm span{font-size:13px;color:var(--mute)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:9}
.hide{display:none}
.modal{position:fixed;inset:0;z-index:20;background:#000000b3;display:flex;align-items:center;justify-content:center;padding:20px}
.modal.hide{display:none}
.mbox{width:100%;max-width:340px;background:var(--card);border-radius:20px;padding:20px;text-align:center;box-shadow:0 5px 0 #00000040,inset 0 0 0 2px #ffffff1a}
.mbox p{margin:0 0 16px;font-size:18px;line-height:1.3}
.mbtns{display:flex;gap:10px}
.mbtns button{flex:1;padding:13px;border:0;border-radius:14px;font:inherit;font-size:17px}
#mNo{background:#00000040;color:var(--ink)}
#mYes{background:var(--minus);color:#fff}
.tot{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tot small{color:var(--mute);font-size:16px}
.big2{min-width:0;overflow-wrap:anywhere;font-size:30px;text-shadow:0 3px 0 #00000055;text-align:right}
.go.sm{padding:14px;font-size:18px}
.sub{display:flex;gap:8px;margin-bottom:12px}
.sub button{flex:1;padding:9px;border:0;border-radius:12px;background:#00000033;color:var(--mute);font:inherit;font-size:15px}
.sub button.on{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 2px var(--gold)}
.tsum{display:flex;justify-content:space-between;font-size:15px;color:var(--mute);padding-bottom:8px;border-bottom:2px dashed #ffffff22}
.tsum b{color:var(--gold)}
.item.done .d b{text-decoration:line-through;opacity:.55}
.chk{flex:none;width:30px;height:30px;border-radius:9px;border:2px solid var(--gold);background:none;color:var(--gold);font:inherit;font-size:18px;padding:0}
.item.done .chk{background:var(--gold);color:#3a2600}
.item .pr{font-size:17px;color:var(--gold)}
.rs{border:0;border-radius:10px;background:#00000040;color:var(--plus);font:inherit;font-size:14px;padding:8px 10px}
.gd{color:var(--gold);font-style:normal}
input.gold{color:var(--gold)}
.ro{padding:13px 14px;border-radius:14px;border:2px dashed #ffffff26;background:#150e36;font-size:22px;min-height:54px;display:flex;align-items:center;word-break:break-word}
.diff{margin-top:12px;text-align:center;padding:12px 8px;border-radius:16px;background:#00000033}
.diff .dv{font-size:34px;line-height:1.1;transition:color .3s}
.diff .dt{font-size:15px;margin-top:3px;color:var(--mute)}
.diff.p .dv,.diff.p .dt{color:var(--plus)}
.diff.m .dv,.diff.m .dt{color:var(--minus)}
.diff.z .dv,.diff.z .dt{color:var(--gold)}
.diff.z .dv{font-size:48px;text-shadow:0 0 22px #ffc83dcc,0 0 4px #fff1a8}
.diff.z .dt{font-size:18px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="modal hide" id="modal"><div class="mbox"><p id="mTxt"></p><div class="mbtns"><button id="mNo">Отмена</button><button id="mYes">Удалить</button></div></div></div>

<div class="me"><div class="av" id="av"></div><div class="nm"><b id="nm"></b><span id="un"></span></div></div>
<div class="week" id="week"></div>
<div class="tabs">
  <button id="t1" class="on">Смена</button>
  <button id="t2">Месяц</button>
  <button id="t3">Задачи</button>
</div>

<section id="v1">
  <div class="card">
    <div class="field"><label>Дата смены</label><input type="date" id="date"></div>
    <div class="field"><label>Прошлая смена (остаток, можно минус)</label>
      <div class="row"><input id="prev" inputmode="decimal" placeholder="0"><button class="pm" data-t="prev">±</button></div></div>
    <div class="field"><label>Наличка</label>
      <div class="row"><input id="cash" inputmode="decimal" placeholder="0"><button class="pm" data-t="cash">±</button></div></div>
    <div class="field"><label>Банк (сдали в банк)</label>
      <input id="bank" class="gold" inputmode="decimal" placeholder="0"></div>
    <div class="g2">
      <div><label>Карта</label><input id="card" inputmode="decimal" placeholder="0"></div>
      <div><label>Переводы</label><input id="tr" inputmode="decimal" placeholder="0"></div>
    </div>
  </div>

  <div class="card">
    <div class="g2">
      <div><label>Должно быть в кассе</label><div class="ro" id="exp">0</div></div>
      <div><label>По факту в кассе</label><input id="act" inputmode="decimal" placeholder="0"></div>
    </div>
    <div class="diff hide" id="diff"><div class="dv" id="dv"></div><div class="dt" id="dt"></div></div>
  </div>

  <div class="card hero" id="hero">
    <small>Остаток после смены (прошлая + наличка − банк)</small>
    <div class="big" id="bal">0</div>
    <div class="tag" id="tag">Введи наличку</div>
    <div class="sum"><span>Карта и переводы</span><b id="nc">0</b></div>
    <div class="sum" style="border:0;margin-top:6px;padding-top:0"><span>Всего за смену</span><b id="all">0</b></div>
    <div class="sum"><span>Банк</span><b id="bk" class="gd">0</b></div>
  </div>

  <button class="go" id="save">Закрыть смену</button>
</section>

<section id="v2" class="hide">
  <div class="card"><label>Месяц</label><input type="month" id="month"></div>
  <div class="card tot"><small>Наличка</small><div class="big2" id="mCash">0</div></div>
  <div class="card tot"><small>Карта</small><div class="big2" id="mCard">0</div></div>
  <div class="card tot"><small>Переводы</small><div class="big2" id="mTr">0</div></div>
  <div class="card hero">
    <div class="tag" id="mCnt">0 смен</div>
    <div class="sum"><span>Всего (нал + карта + переводы)</span><b id="mAll">0</b></div>
    <div class="sum" style="border:0;margin-top:6px;padding-top:0"><span>Банк за месяц</span><b id="mBank" class="gd">0</b></div>
    <div class="sum" style="border:0;margin-top:6px;padding-top:0"><span>Касса за месяц (факт − должно быть)</span><b id="mK">0</b></div>
    <div class="sum"><span>Баланс на конец месяца</span><b id="mBal">0</b></div>
  </div>
  <div class="card" id="list"></div>
</section>

<section id="v3" class="hide">
  <div class="card">
    <div class="field"><label>Задача</label><input id="tTitle" placeholder="Что нужно сделать" maxlength="80" style="font-size:18px"></div>
    <div class="g2">
      <div><label>Ценик</label><input id="tPrice" inputmode="decimal" placeholder="0"></div>
      <div style="align-self:end"><button class="go sm" id="tAdd">Добавить</button></div>
    </div>
  </div>
  <div class="sub"><button id="s1" class="on">Задачи</button><button id="s2">Корзина</button></div>
  <div class="card" id="tList"></div>
</section>

<script>
const CUR = '₽'; // поменяй на свою валюту
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor('#1a1240'); tg.setBackgroundColor('#1a1240'); } catch (e) {} }
const buzz = t => { try { tg && tg.HapticFeedback.notificationOccurred(t); } catch (e) {} };
const tap = () => { try { tg && tg.HapticFeedback.impactOccurred('light'); } catch (e) {} };

const $ = id => document.getElementById(id);
let onYes = null;
function ask(text, yes) {
  $('mTxt').textContent = text; onYes = yes; $('modal').classList.remove('hide'); buzz('warning');
}
const closeAsk = () => { $('modal').classList.add('hide'); onYes = null; };
$('mNo').onclick = closeAsk;
$('mYes').onclick = () => { const f = onYes; closeAsk(); if (f) f(); };
$('modal').onclick = e => { if (e.target === $('modal')) closeAsk(); };
/* профиль из Telegram: у каждого аккаунта свои данные */
const U = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
const uid = U && U.id ? String(U.id) : 'guest';
const KEY = 'shifts_v1_' + uid;
try { /* однократно забираем данные, сохранённые до появления профилей */
  ['shifts_v1', 'tasks_v1'].forEach(k => {
    const old = localStorage.getItem(k);
    if (old !== null && localStorage.getItem(k + '_' + uid) === null) { localStorage.setItem(k + '_' + uid, old); localStorage.removeItem(k); }
  });
} catch (e) {}
(function () {
  const name = U ? [U.first_name, U.last_name].filter(Boolean).join(' ') || 'Без имени' : 'Гость';
  $('nm').textContent = name;
  $('un').textContent = U ? (U.username ? '@' + U.username : 'ID ' + U.id) : 'Открыто вне Telegram';
  const av = $('av'), ini = () => { av.textContent = (name[0] || '?').toUpperCase(); };
  if (U && U.photo_url) {
    const im = new Image(); im.alt = ''; im.referrerPolicy = 'no-referrer';
    im.onerror = ini; im.onload = () => { av.textContent = ''; av.appendChild(im); }; im.src = U.photo_url;
  }
  ini();
})();
let shifts = [];
try { shifts = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) {}
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(shifts)); } catch (e) {} };

const num = s => { const n = parseFloat(String(s).replace(/\s/g, '').replace(',', '.')); return isNaN(n) ? 0 : n; };
const fmt = n => (Math.round(n * 100) / 100).toLocaleString('ru-RU') + ' ' + CUR;
const sgn = n => (n > 0 ? '+' : '') + fmt(n);
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const sorted = () => shifts.slice().sort((a, b) => a.date.localeCompare(b.date) || a.id - b.id);
const lastBal = () => { const s = sorted(); return s.length ? s[s.length - 1].bal : 0; };

/* count-up */
let shown = 0, raf;
function countTo(el, to) {
  cancelAnimationFrame(raf);
  const from = shown, t0 = performance.now();
  const step = t => {
    const k = Math.min(1, (t - t0) / 500), e = 1 - Math.pow(1 - k, 3);
    shown = from + (to - from) * e;
    el.textContent = fmt(shown);
    if (k < 1) raf = requestAnimationFrame(step); else shown = to;
  };
  raf = requestAnimationFrame(step);
}

function calc() {
  const prev = num($('prev').value), cash = num($('cash').value);
  const card = num($('card').value), tr = num($('tr').value), bank = num($('bank').value);
  const bal = prev + cash - bank;
  $('exp').textContent = fmt(bal);
  $('bk').textContent = fmt(bank);
  const big = $('bal');
  countTo(big, bal);
  big.className = 'big ' + (bal > 0 ? 'p' : bal < 0 ? 'm' : '');
  $('tag').textContent = $('cash').value === '' && $('prev').value === '' && $('bank').value === '' ? 'Введи наличку'
    : bal > 0 ? 'В плюсе на ' + fmt(bal) : bal < 0 ? 'В минусе на ' + fmt(-bal) : 'Ровно в ноль';
  $('nc').textContent = fmt(card + tr);
  $('all').textContent = fmt(cash + card + tr);
  const df = $('diff');
  if ($('act').value === '') { df.className = 'diff hide'; }
  else {
    const d = Math.round((num($('act').value) - bal) * 100) / 100;
    if (d === 0) { df.className = 'diff z'; $('dv').textContent = '0'; $('dt').textContent = 'Идеально ✨'; }
    else if (d > 0) { df.className = 'diff p'; $('dv').textContent = '+' + fmt(d); $('dt').textContent = 'Больше на ' + fmt(d); }
    else { df.className = 'diff m'; $('dv').textContent = '−' + fmt(-d); $('dt').textContent = 'Меньше на ' + fmt(-d); }
  }
}

function resetForm() {
  $('date').value = today();
  $('prev').value = shifts.length ? lastBal() : '';
  ['cash', 'card', 'tr', 'bank', 'act'].forEach(i => $(i).value = '');
  calc();
}

/* неделя: 7 полосок, сегодняшний день светится */
function level() {
  const names = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
  const now = (new Date().getDay() + 6) % 7;
  $('week').innerHTML = names.map((n, i) =>
    `<div class="day${i > 4 ? ' we' : ''}${i === now ? ' on' : ''}"><i></i>${n}</div>`).join('');
}

/* confetti */
const cv = $('fx'), cx = cv.getContext('2d');
let parts = [], running = false;
function size() { cv.width = innerWidth; cv.height = innerHeight; }
addEventListener('resize', size); size();
function burst(good) {
  if (matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  const cols = good ? ['#ffc83d', '#3ee6a8', '#fff4e0', '#ff8ad8', '#6ab7ff'] : ['#ff5a6e', '#8a2a3a', '#444'];
  for (let i = 0; i < (good ? 140 : 50); i++) {
    const a = Math.random() * Math.PI * 2, v = 5 + Math.random() * 9;
    parts.push({ x: innerWidth / 2, y: innerHeight * .6, vx: Math.cos(a) * v, vy: Math.sin(a) * v - (good ? 7 : 2),
      s: 5 + Math.random() * 7, c: cols[i % cols.length], r: Math.random() * 6, coin: good && i % 4 === 0, life: 90 + Math.random() * 40 });
  }
  if (!running) { running = true; requestAnimationFrame(loop); }
}
function loop() {
  cx.clearRect(0, 0, cv.width, cv.height);
  parts = parts.filter(p => p.life-- > 0);
  parts.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.vy += .35; p.vx *= .99; p.r += .2;
    cx.globalAlpha = Math.min(1, p.life / 30); cx.fillStyle = p.c;
    if (p.coin) { cx.beginPath(); cx.ellipse(p.x, p.y, p.s, p.s * Math.abs(Math.cos(p.r)), 0, 0, 7); cx.fill(); }
    else { cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); cx.restore(); }
  });
  cx.globalAlpha = 1;
  if (parts.length) requestAnimationFrame(loop); else { running = false; cx.clearRect(0, 0, cv.width, cv.height); }
}

/* save */
$('save').onclick = () => {
  if ($('cash').value === '' && $('card').value === '' && $('tr').value === '' && $('bank').value === '') {
    $('save').classList.remove('shake'); void $('save').offsetWidth; $('save').classList.add('shake'); buzz('warning'); return;
  }
  const prev = num($('prev').value), cash = num($('cash').value), bank = num($('bank').value);
  const rec = { id: Date.now(), date: $('date').value || today(), prev, cash, bank, card: num($('card').value), tr: num($('tr').value), bal: prev + cash - bank,
    exp: prev + cash - bank, act: $('act').value === '' ? null : num($('act').value) };
  shifts.push(rec); persist();
  const good = rec.bal >= 0;
  burst(good); buzz(good ? 'success' : 'error');
  const h = $('hero'); h.classList.remove('shake', 'pop'); void h.offsetWidth; h.classList.add(good ? 'pop' : 'shake');
  level();
  $('tag').textContent = good ? 'Смена закрыта! Остаток ' + fmt(rec.bal) : 'Смена закрыта, минус ' + fmt(-rec.bal);
  setTimeout(resetForm, 1600);
};

/* ± buttons */
document.querySelectorAll('.pm').forEach(b => b.onclick = () => {
  tap(); const el = $(b.dataset.t), v = el.value.trim();
  el.value = v.startsWith('-') ? v.slice(1) : '-' + (v || ''); calc();
});
['prev', 'cash', 'card', 'tr', 'bank', 'act'].forEach(i => $(i).addEventListener('input', calc));
$('date').addEventListener('change', tap);

/* month */
function renderMonth() {
  const m = $('month').value;
  const list = sorted().filter(s => s.date.startsWith(m));
  const sum = k => list.reduce((a, s) => a + s[k], 0);
  const cash = sum('cash'), card = sum('card'), tr = sum('tr');
  $('mAll').textContent = fmt(cash + card + tr);
  $('mCnt').textContent = list.length + ' ' + (list.length % 10 === 1 && list.length !== 11 ? 'смена' : [2, 3, 4].includes(list.length % 10) && ![12, 13, 14].includes(list.length) ? 'смены' : 'смен');
  $('mCash').textContent = fmt(cash); $('mCard').textContent = fmt(card); $('mTr').textContent = fmt(tr);
  const bankSum = list.reduce((a, s) => a + (s.bank || 0), 0);
  $('mBank').textContent = fmt(bankSum);
  const chk = list.filter(s => s.exp != null && s.act != null);
  const kk = Math.round(chk.reduce((a, s) => a + (s.act - s.exp), 0) * 100) / 100;
  $('mK').textContent = !chk.length ? '—' : kk === 0 ? '0 · Идеально ✨' : sgn(kk);
  $('mK').style.color = !chk.length ? '' : kk > 0 ? 'var(--plus)' : kk < 0 ? 'var(--minus)' : 'var(--gold)';
  const bal = list.length ? list[list.length - 1].bal : 0;
  $('mBal').textContent = sgn(bal);
  $('list').innerHTML = list.length ? list.slice().reverse().map(s => `
    <div class="item"><div class="d"><b>${s.date.split('-').reverse().join('.')}</b>
      <span>нал ${fmt(s.cash)} · карта ${fmt(s.card)} · перевод ${fmt(s.tr)}${s.bank ? ' · <em class="gd">банк ' + fmt(s.bank) + '</em>' : ''}${s.exp != null && s.act != null ? ' · касса ' + sgn(s.act - s.exp) : ''}</span></div>
      <div class="v ${s.bal >= 0 ? 'p' : 'm'}">${sgn(s.bal)}</div>
      <button class="del" data-id="${s.id}" aria-label="Удалить смену">✕</button></div>`).join('')
    : '<div class="empty">В этом месяце смен пока нет. Закрой первую.</div>';
  document.querySelectorAll('.del').forEach(b => b.onclick = () => {
    const id = b.dataset.id;
    ask('Удалить эту смену?', () => { shifts = shifts.filter(s => s.id != id); persist(); renderMonth(); level(); resetForm(); });
  });
}
$('month').addEventListener('change', renderMonth);

/* tabs */
function tab(n) {
  tap();
  [1, 2, 3].forEach(i => { $('v' + i).classList.toggle('hide', n !== i); $('t' + i).classList.toggle('on', n === i); });
  if (n === 2) renderMonth();
  if (n === 3) renderTasks();
}
$('t1').onclick = () => tab(1); $('t2').onclick = () => tab(2); $('t3').onclick = () => tab(3);

/* задачи + корзина (хранится 7 дней) */
const TKEY = 'tasks_v1_' + uid, WEEK = 7 * 24 * 3600 * 1000;
let tasks = [], view = 'list';
try { tasks = JSON.parse(localStorage.getItem(TKEY) || '[]'); } catch (e) {}
const tPersist = () => { try { localStorage.setItem(TKEY, JSON.stringify(tasks)); } catch (e) {} };
const purge = () => { const n = tasks.length; tasks = tasks.filter(t => !t.del || Date.now() - t.del < WEEK); if (tasks.length !== n) tPersist(); };
const esc = x => String(x).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function renderTasks() {
  purge();
  const act = tasks.filter(t => !t.del), bin = tasks.filter(t => t.del);
  $('s1').textContent = 'Задачи' + (act.length ? ' (' + act.length + ')' : '');
  $('s2').textContent = 'Корзина' + (bin.length ? ' (' + bin.length + ')' : '');
  $('s1').classList.toggle('on', view === 'list'); $('s2').classList.toggle('on', view === 'bin');
  const box = $('tList');
  if (view === 'list') {
    const total = act.filter(t => !t.done).reduce((a, t) => a + (t.price || 0), 0);
    box.innerHTML = act.length
      ? '<div class="tsum"><span>Осталось на сумму</span><b>' + fmt(total) + '</b></div>' + act.slice().reverse().map(t => `
        <div class="item${t.done ? ' done' : ''}"><button class="chk" data-c="${t.id}" aria-label="Готово">${t.done ? '✓' : ''}</button>
          <div class="d"><b>${esc(t.title)}</b></div>
          ${t.price ? `<div class="pr">${fmt(t.price)}</div>` : ''}
          <button class="del" data-x="${t.id}" aria-label="В корзину">✕</button></div>`).join('')
      : '<div class="empty">Задач пока нет. Добавь первую.</div>';
  } else {
    box.innerHTML = bin.length
      ? bin.slice().sort((a, b) => b.del - a.del).map(t => {
          const left = Math.max(1, Math.ceil((t.del + WEEK - Date.now()) / 86400000));
          return `<div class="item"><div class="d"><b>${esc(t.title)}</b><span>${t.price ? fmt(t.price) + ' · ' : ''}удалится через ${left} дн.</span></div>
            <button class="rs" data-r="${t.id}">Вернуть</button>
            <button class="del" data-f="${t.id}" aria-label="Удалить навсегда">🗑</button></div>`;
        }).join('')
      : '<div class="empty">Корзина пуста. Удалённые задачи лежат здесь 7 дней.</div>';
  }
  const by = (a, fn) => box.querySelectorAll('[' + a + ']').forEach(b => b.onclick = () => { tap(); fn(tasks.find(t => t.id == b.getAttribute(a)), b.getAttribute(a)); tPersist(); renderTasks(); });
  by('data-c', t => { t.done = !t.done; });
  by('data-x', t => { t.del = Date.now(); });
  by('data-r', t => { t.del = null; });
  box.querySelectorAll('[data-f]').forEach(b => b.onclick = () => {
    const id = b.getAttribute('data-f'), t = tasks.find(x => x.id == id);
    ask('Удалить «' + (t ? t.title : '') + '» навсегда? Вернуть будет нельзя.', () => { tasks = tasks.filter(x => x.id != id); tPersist(); renderTasks(); });
  });
}
$('tAdd').onclick = () => {
  const title = $('tTitle').value.trim();
  if (!title) { $('tAdd').classList.remove('shake'); void $('tAdd').offsetWidth; $('tAdd').classList.add('shake'); buzz('warning'); return; }
  tasks.push({ id: Date.now(), title, price: num($('tPrice').value) || null, done: false, del: null });
  tPersist(); $('tTitle').value = ''; $('tPrice').value = ''; view = 'list'; buzz('success'); renderTasks();
};
$('tTitle').addEventListener('keydown', e => { if (e.key === 'Enter') $('tAdd').click(); });
$('s1').onclick = () => { tap(); view = 'list'; renderTasks(); };
$('s2').onclick = () => { tap(); view = 'bin'; renderTasks(); };

$('month').value = today().slice(0, 7);
level(); resetForm();
</script>
</body>
</html>
